name: Keep Supabase DB Active

on:
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allow manual trigger from GitHub

# Makes one web request and touches nothing in the repository.
permissions: {}

jobs:
  keep-db-active:
    runs-on: ubuntu-latest
    steps:
      - name: Keep Supabase database active
        env:
          SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL || vars.REACT_APP_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.REACT_APP_SUPABASE_PUBLISHABLE_DEFAULT_KEY || secrets.REACT_APP_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
        # Asks for the sign-in page's totals: the one thing the public key may still read,
        # and a real query, which is what counts as activity. (The API root this used to
        # fetch needs a secret key now and never reached the database.)
        run: |
          curl -sS -o /dev/null -w 'club_stats: HTTP %{http_code}\n' -X POST \
            "$SUPABASE_URL/rest/v1/rpc/club_stats" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
        continue-on-error: true

      - name: Log success
        run: echo "Database activity check completed"
