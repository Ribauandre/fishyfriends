name: Keep Supabase DB Active

on:
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allow manual trigger from GitHub

jobs:
  keep-db-active:
    runs-on: ubuntu-latest
    steps:
      - name: Keep Supabase database active
        run: |
          curl -X GET \
            "${{ secrets.REACT_APP_SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.REACT_APP_SUPABASE_PUBLISHABLE_DEFAULT_KEY || vars.REACT_APP_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.REACT_APP_SUPABASE_PUBLISHABLE_DEFAULT_KEY || vars.REACT_APP_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}"
        continue-on-error: true
      
      - name: Log success
        run: echo "Database activity check completed"
