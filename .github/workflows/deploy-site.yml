name: Build and publish Fishy Friends

on:
  push:
    branches: [deploy]
  workflow_dispatch:

permissions:
  contents: write

# One deploy at a time, in order. Two pushes close together used to mean two runs applying
# migrations and pushing the built site at once; a queued run now waits for the one ahead.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  build-site:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out deploy branch
        uses: actions/checkout@v4
        with:
          # The token that can push to this repository is not left in the checkout's git
          # config, where every script the install and build steps run could have used it
          # (one compromised dependency would have been able to publish to the site). It is
          # handed to the one step that pushes, at the bottom.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # Exactly what the lockfile pins, and nothing a package asks to run while it is being
        # installed: an install script is how a compromised package most often gets to run
        # in a build, and the next step but one holds the database password. (Of the 1,369
        # packages only core-js's donation banner and a macOS-only helper have one.)
        run: npm ci --ignore-scripts

      - name: Verify Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL || vars.REACT_APP_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.REACT_APP_SUPABASE_PUBLISHABLE_DEFAULT_KEY || secrets.REACT_APP_SUPABASE_PUBLISHABLE_DEFAULT_KEY || vars.REACT_APP_SUPABASE_ANON_KEY || secrets.REACT_APP_SUPABASE_ANON_KEY || vars.REACT_APP_SUPABASE_PUBLISHABLE_KEY || secrets.REACT_APP_SUPABASE_PUBLISHABLE_KEY }}
        # Refuses a secret key in either format (sb_secret_…, or the legacy service_role JWT,
        # which looks just like the anon one) before it can be compiled into the bundle.
        run: node scripts/checkSupabaseKey.mjs

      - name: Run pending DB migrations
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::SUPABASE_DB_URL secret not set — skipping automatic DB migrations. Add it in repo Settings > Secrets to enable them."
          else
            node supabase/run-migrations.mjs
          fi

      - name: Build site with Supabase configuration
        env:
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL || vars.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ vars.REACT_APP_SUPABASE_PUBLISHABLE_DEFAULT_KEY || secrets.REACT_APP_SUPABASE_PUBLISHABLE_DEFAULT_KEY || vars.REACT_APP_SUPABASE_ANON_KEY || secrets.REACT_APP_SUPABASE_ANON_KEY || vars.REACT_APP_SUPABASE_PUBLISHABLE_KEY || secrets.REACT_APP_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build:github

      - name: Commit generated docs
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Build deploy site"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
