name: Build and publish Fishy Friends

on:
  push:
    branches: [deploy]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deploy branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL || vars.REACT_APP_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.REACT_APP_SUPABASE_PUBLISHABLE_DEFAULT_KEY || vars.REACT_APP_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing REACT_APP_SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_KEY" || (echo "Missing REACT_APP_SUPABASE_PUBLISHABLE_DEFAULT_KEY" && exit 1)

      - name: Build site with Supabase configuration
        env:
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL || vars.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.REACT_APP_SUPABASE_PUBLISHABLE_DEFAULT_KEY || vars.REACT_APP_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
        run: npm run build:github

      - name: Commit generated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Build deploy site"
          git push
