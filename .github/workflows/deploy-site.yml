name: Build and publish Fishy Friends

on:
  push:
    branches: [deploy]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deploy branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL || vars.REACT_APP_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.REACT_APP_SUPABASE_PUBLISHABLE_DEFAULT_KEY || secrets.REACT_APP_SUPABASE_PUBLISHABLE_DEFAULT_KEY || vars.REACT_APP_SUPABASE_ANON_KEY || secrets.REACT_APP_SUPABASE_ANON_KEY || vars.REACT_APP_SUPABASE_PUBLISHABLE_KEY || secrets.REACT_APP_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing REACT_APP_SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_KEY" || (echo "Missing REACT_APP_SUPABASE_PUBLISHABLE_DEFAULT_KEY" && exit 1)
          case "$SUPABASE_KEY" in
            sb_publishable_*) ;;
            eyJ*) ;;
            sb_secret_*) echo "The selected value is a Supabase secret key. Check that the publishable key is saved in the GitHub Variable REACT_APP_SUPABASE_PUBLISHABLE_DEFAULT_KEY."; exit 1 ;;
            *) echo "The selected Supabase key is not a recognized publishable/anon key format."; exit 1 ;;
          esac

      - name: Run pending DB migrations
        if: ${{ secrets.SUPABASE_DB_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node supabase/run-migrations.mjs

      - name: Warn if DB migrations were skipped
        if: ${{ secrets.SUPABASE_DB_URL == '' }}
        run: echo "::warning::SUPABASE_DB_URL secret not set — skipping automatic DB migrations. Add it in repo Settings > Secrets to enable them."

      - name: Build site with Supabase configuration
        env:
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL || vars.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ vars.REACT_APP_SUPABASE_PUBLISHABLE_DEFAULT_KEY || secrets.REACT_APP_SUPABASE_PUBLISHABLE_DEFAULT_KEY || vars.REACT_APP_SUPABASE_ANON_KEY || secrets.REACT_APP_SUPABASE_ANON_KEY || vars.REACT_APP_SUPABASE_PUBLISHABLE_KEY || secrets.REACT_APP_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build:github

      - name: Commit generated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Build deploy site"
          git push
