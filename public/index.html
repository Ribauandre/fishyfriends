<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      What this page may load, and from where. It has to be a <meta>: GitHub Pages can't send
      response headers. Its main job is script-src 'self' — only this site's own script files
      run, so text someone manages to get onto a page can't become code (no inline script, no
      script from elsewhere). The rest lists the few outside places the app really uses:
      Supabase (data, photos, live updates), Google Fonts, the map tiles, the weather service
      and Google My Maps imports. Images only come from this site and the project's own
      storage, so a photo address pointed at someone else's server can't be used to see who
      opens a page. Keep this FIRST in the head; add a host here when the app starts using one.
      Not settable from a <meta> (so see boot.js): frame-ancestors.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: %REACT_APP_SUPABASE_URL% https://tile.openstreetmap.org https://tiles.openseamap.org; connect-src 'self' %REACT_APP_SUPABASE_URL% wss://*.supabase.co https://api.open-meteo.com https://geocoding-api.open-meteo.com https://www.google.com; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#03080b" />
    <meta property="og:site_name" content="Fishy Friends" />
    <meta property="og:title" content="Fishy Friends" />
    <meta property="og:description" content="Trips, tournaments, Fish Year and personal bests for the crew." />
    <meta property="og:image" content="https://www.fishyfriends.club/icon-512.png" />
    <meta property="og:type" content="website" />
    <meta
      name="description"
      content="Fishy Friends — a fishing-club social app for your crew's Fish Year challenge, tournaments, and personal bests."
    />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fishy Friends" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;700&family=Jersey+10&display=swap" rel="stylesheet" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>FishyFriends</title>
    <!-- Frame guard and the deep-link restore from 404.html. A file, not inline: see the policy above. -->
    <script src="%PUBLIC_URL%/boot.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
